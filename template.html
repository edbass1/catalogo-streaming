<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catalogo RaiPlay · RSI · LA7</title><style>
body{font-family:system-ui,sans-serif;margin:0;background:#111;color:#eee}header{padding:12px 18px;background:#1c1c1c}
nav button,.sub button{background:#2a2a2a;color:#eee;border:0;padding:8px 14px;margin:3px;border-radius:6px;cursor:pointer}
nav button.on,.sub button.on{background:#e50914}.wrap{padding:12px 18px}small{color:#999}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.c{background:#1e1e1e;border-radius:8px;padding:10px}.c a{color:#fff;font-weight:600;text-decoration:none}
.r{float:right;background:#f5c518;color:#000;border-radius:4px;padding:1px 6px;font-weight:700}
.tag{display:inline-block;font-size:11px;background:#333;border-radius:4px;padding:1px 5px;margin:2px 2px 0 0}
.pv{background:#0a7}.cl{background:#c80}p{font-size:13px;color:#bbb;margin:6px 0 0}#gen label{margin-right:10px;font-size:13px}
</style></head><body><header><b>Catalogo gratuito: RaiPlay · RSI Play · LA7 Cinema</b><br><small>Aggiornato: __NOW__ — __STATS__</small>
<nav id="nav"></nav></header><div class="wrap"><input id="q" type="search" placeholder="Cerca titolo, genere, trama…" style="padding:7px;border-radius:6px;border:0;margin:3px;width:260px"><div class="sub" id="typ"></div><div class="sub" id="sub"></div><div id="gen"></div><div class="grid" id="g"></div></div>
<script>
const DATA=__DATA__;let S=Object.keys(DATA.sections)[0],V='voto',G=new Set(),T='tutti';
const subs=[['voto','Voto IMDb'],['prima','Prime visioni / novità'],['generi','Per genere'],['clou','IL CLOU']];
function nav(){const n=document.getElementById('nav');n.innerHTML='';Object.keys(DATA.sections).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.className=k==S?'on':'';b.onclick=()=>{S=k;G.clear();T='tutti';if(k=='Teche Rai')V='tutto';else if(V=='tutto'||V=='nuovi'||V=='box')V='voto';render()};n.appendChild(b)})}
function card(e){return `<div class="c">${e.rating?`<span class="r">${e.rating}</span>`:''}<a href="${e.url}" target="_blank">${esc(e.title)}</a> <small>${e.year||''}</small><br><small>${esc(e.platform)}${e.seen&&e.prima?' · nuovo dal '+e.seen:e.added?' · agg. '+e.added:''}${e.episodes>1?' · '+e.episodes+' episodi':''}${e.votes?' · '+e.votes.toLocaleString('it')+' voti':''}</small><br>${e.prima?'<span class="tag pv">Prima visione/novità</span>':''}${e.clou?'<span class="tag cl">Il Clou</span>':''}${e.genres.map(g=>`<span class="tag">${esc(g)}</span>`).join('')}<p>${esc((e.desc||'').slice(0,220))}</p></div>`}
function fold(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function srch(L){const q=fold(document.getElementById('q').value).trim();if(!q)return L;const w=q.split(/\s+/);return L.filter(e=>{const h=fold([e.title,e.orig,e.desc,e.genres.join(' ')].join(' '));return w.every(x=>h.includes(x))})}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){nav();const typ=document.getElementById('typ');typ.innerHTML='';const sub=document.getElementById('sub'),gen=document.getElementById('gen'),g=document.getElementById('g');gen.innerHTML='';

sub.innerHTML='';(S=='Teche Rai'?[['tutto','Catalogo completo'],['nuovi','Nuovi arrivi (50 più recenti)'],['box','Box set'],['voto','Voto IMDb'],['generi','Per genere'],['clou','IL CLOU']]:subs).forEach(([k,l])=>{const b=document.createElement('button');b.textContent=(k=='prima'&&S=='RSI Play')?'AGGIUNTI (ultimi 10 giorni)':l;b.className=k==V?'on':'';b.onclick=()=>{V=k;render()};sub.appendChild(b)});
let L=DATA.sections[S].filter(e=>!e.excluded);
if(new Set(DATA.sections[S].map(e=>e.type)).size>1){[['tutti','Tutti'],['film','Film'],['serie','Serie TV']].forEach(([k,l])=>{const b=document.createElement('button');b.textContent=l;b.className=k==T?'on':'';b.onclick=()=>{T=k;G.clear();render()};typ.appendChild(b)});if(T!='tutti')L=L.filter(e=>e.type==T)}
if(V=='generi'){const all=[...new Set(L.flatMap(e=>e.genres))].sort();gen.innerHTML=all.map(x=>`<label><input type=checkbox value="${esc(x)}" ${G.has(x)?'checked':''}> ${esc(x)}</label>`).join('');gen.querySelectorAll('input').forEach(i=>i.onchange=()=>{i.checked?G.add(i.value):G.delete(i.value);render()});if(G.size)L=L.filter(e=>e.genres.some(x=>G.has(x)))}
if(V=='box')L=L.filter(e=>e.episodes>1);if(V=='nuovi')L=[...DATA.sections[S]].sort((a,b)=>(b.added||'').localeCompare(a.added||'')).slice(0,50).filter(e=>!e.excluded);L=srch(L);if(V=='prima')L=L.filter(e=>e.prima);if(V=='clou')L=L.filter(e=>e.clou);
if(V=='box')L.sort((a,b)=>b.episodes-a.episodes);else if(V!='nuovi'&&V!='tutto')L.sort((a,b)=>(V=='prima'&&a.seen)?b.seen.localeCompare(a.seen):V=='clou'?(b.votes||0)-(a.votes||0):(b.rating||0)-(a.rating||0));g.innerHTML=L.map(card).join('')||'<small>Nessun titolo</small>'}
document.getElementById('q').oninput=render;render();</script></body></html>
