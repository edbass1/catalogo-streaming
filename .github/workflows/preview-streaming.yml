name: Anteprima sito con cataloghi Sky
on:
  push:
    branches:
      - test-cataloghi-tmdb
    paths:
      - 'build.py'
      - 'template.html'
      - 'experimental/build_streaming_catalog.py'
      - '.github/workflows/preview-streaming.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout branch di prova
        uses: actions/checkout@v4
        with:
          ref: test-cataloghi-tmdb
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scarica dataset IMDb
        run: |
          mkdir -p imdb
          for f in title.ratings title.basics title.akas; do
            curl -sfL -o "imdb/$f.tsv.gz" "https://datasets.imdbws.com/$f.tsv.gz"
          done
      - name: Genera catalogo completo
        run: python3 build.py
      - name: Pubblica anteprima completa
        uses: actions/upload-artifact@v4
        with:
          name: anteprima-sito-sky
          path: |
            index.html
            catalogo.json
          if-no-files-found: error
          retention-days: 14
