name: Aggiorna catalogo
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'build.py'
      - '.github/workflows/aggiorna.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: week
        run: echo "w=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: imdb
          key: imdb-${{ steps.week.outputs.w }}
      - name: Scarica dataset IMDb
        run: |
          mkdir -p imdb
          for f in title.ratings title.basics title.akas; do
            [ -f imdb/$f.tsv.gz ] || curl -sfL -o imdb/$f.tsv.gz https://datasets.imdbws.com/$f.tsv.gz
          done
      - name: Recupera stato RSI
        run: git fetch origin data && git show origin/data:rsi_seen.json > /tmp/s.json && mv /tmp/s.json rsi_seen.json || echo "nessuno stato, primo avvio"
      - name: Genera catalogo
        run: python3 build.py
      - name: Salva stato RSI
        run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          d=$(mktemp -d); git worktree add --orphan -b tmpdata "$d" 2>/dev/null || git worktree add --detach "$d"
          cd "$d"; git fetch origin data && git checkout -B data origin/data || git checkout --orphan data
          git rm -rqf . 2>/dev/null || true; cp "$GITHUB_WORKSPACE/rsi_seen.json" .
          git add rsi_seen.json; git commit -qm "Stato RSI $(date -u +%F)" || true; git push origin HEAD:data
      - name: Prepara sito
        run: mkdir -p _site && cp index.html catalogo.json _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
