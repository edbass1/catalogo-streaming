name: Aggiorna catalogo
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: week
        run: echo "w=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: imdb
          key: imdb-${{ steps.week.outputs.w }}
      - name: Scarica dataset IMDb
        run: |
          mkdir -p imdb
          for f in title.ratings title.basics title.akas; do
            [ -f imdb/$f.tsv.gz ] || curl -sfL -o imdb/$f.tsv.gz https://datasets.imdbws.com/$f.tsv.gz
          done
      - name: Genera catalogo
        run: python3 build.py
      - name: Prepara sito
        run: mkdir -p _site && cp index.html catalogo.json _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
